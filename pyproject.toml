[project]
name = "pyside6-compact-documentation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mkdocs>=1.6.1",
    "mkdocs-bibtex>=4.4.0",
    "mkdocs-cinder>=1.2.0",
    "mkdocs-macros-plugin>=1.5.0",
    "mkdocs-material>=9.7.0",
    "mkdocstrings[python]>=0.30.1",
    "pygments>=2.19.2",
    "pyside6>=6.10.1",
]

[tool.poe.tasks]
serve = "mkdocs serve"
deploy = "mkdocs gh-deploy"
